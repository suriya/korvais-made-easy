<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Korvai's Made Easy — Carnatic music rhythmic composition calculator.">
  <title>Korvai's Made Easy</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#141311">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mobile-shell">
    <!-- Top Header -->
    <header class="mobile-header">
      <div class="logo-area">
        <span class="logo-mark">♫</span>
        <div>
          <h1 class="logo-title">Korvai's Made Easy</h1>
        </div>
      </div>

      <div class="nav-controls">
        <button id="btn-save-favorite" class="btn primary" title="Save current query">★ Save Query</button>
      </div>
    </header>

    <main>
      <!-- 1. Thalam & Eduppu (First Input) -->
      <section class="mobile-card" aria-label="Thalam and Eduppu">
        <div class="mobile-card-title">
          <span>1. Thalam &amp; Eduppu</span>
          <span class="panel-hint">4 letters / beat</span>
        </div>

        <div class="compact-field" style="margin-bottom: 10px;">
          <label for="select-thalam-preset">
            <span>Thalam Preset</span>
            <span id="thalam-beats-label" class="form-sub">8 beats (32)</span>
          </label>
          <select id="select-thalam-preset" class="select-input"></select>
        </div>

        <div class="thalam-eduppu-grid">
          <div class="compact-field">
            <label for="input-thalam">
              <span>Thalam (Letters)</span>
            </label>
            <input id="input-thalam" type="number" inputmode="numeric" min="2" step="2" value="32" class="number-input">
          </div>

          <div class="compact-field">
            <label for="input-eduppu">
              <span>Eduppu (Letters)</span>
              <span id="eduppu-beats-label" class="form-sub">1 beat</span>
            </label>
            <input id="input-eduppu" type="number" inputmode="numeric" min="0" step="1" value="4" class="number-input">
          </div>
        </div>

        <div id="eduppu-quick-chips" class="preset-chips-row">
          <span class="panel-hint">Eduppu:</span>
          <button type="button" class="preset-chip" data-eduppu="0">0 (Samam)</button>
          <button type="button" class="preset-chip" data-eduppu="2">2 (½b)</button>
          <button type="button" class="preset-chip" data-eduppu="3">3 (¾b)</button>
          <button type="button" class="preset-chip" data-eduppu="4">4 (1b)</button>
          <button type="button" class="preset-chip" data-eduppu="6">6 (1½b)</button>
        </div>
      </section>

      <!-- 2. Nadai Sequence -->
      <section class="mobile-card" aria-label="Nadai Sequence">
        <div class="mobile-card-title">
          <span>2. Nadai Sequence</span>
          <span id="sequence-canonical-text" class="form-sub">4-66-888</span>
        </div>

        <!-- Active Sequence Visual Display -->
        <div id="sequence-display-box" class="sequence-display-box" style="min-height: 48px; padding: 9px 10px; margin-bottom: 10px;">
          <div id="sequence-groups-row" class="sequence-groups-row"></div>
        </div>

        <!-- Keypad Controls Row -->
        <div class="keypad-controls-row" style="margin-bottom: 10px;">
          <button id="btn-key-sep" class="btn">
            <strong>—</strong>&nbsp;Group
          </button>
          <button id="btn-key-backspace" class="btn">
            ⌫ Backspace
          </button>
          <button id="btn-key-clear" class="btn danger">
            ✕ Clear
          </button>
        </div>

        <!-- Family-Grouped Speed Buttons -->
        <div id="keypad-rows" class="keypad-rows" style="margin-bottom: 4px;"></div>
      </section>

      <!-- 3. Results: Phrase Values Only (Top N in ascending order of total duration) -->
      <section class="mobile-card" aria-label="Korvai Phrase Values">
        <div class="mobile-card-title">
          <span>3. Korvai Phrase Lengths</span>
          <span id="solutions-count-badge" class="panel-hint">Top 30</span>
        </div>

        <div id="error-banner" style="display: none; color: #fca5a5; font-size: 0.86rem; padding: 8px 0;"></div>

        <div id="phrase-results-grid" class="phrase-results-grid"></div>
      </section>

      <!-- 4. Saved / Favorite Queries -->
      <section class="mobile-card" aria-label="Saved Queries">
        <div class="mobile-card-title">
          <span>★ Saved Queries</span>
          <span id="favorites-count-label" class="panel-hint">0 saved</span>
        </div>
        <div id="favorites-list" class="favorites-list"></div>
      </section>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toast-banner" class="toast-banner"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((err) => {
          console.log('ServiceWorker registration note:', err);
        });
      });
    }
  </script>
</body>
</html>
